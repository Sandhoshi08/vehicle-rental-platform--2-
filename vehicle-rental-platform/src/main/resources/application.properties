spring.application.name=vehicle-rental-platform

# H2 file-based database (persists between restarts in ./data/)
spring.datasource.url=jdbc:h2:file:./data/rentaldb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console for inspecting data: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# JWT
app.jwt.secret=ChangeThisSecretKeyInProductionItMustBeAtLeast256BitsLongForHS256
app.jwt.expiration-ms=86400000
