<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — ROADSHARE</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="nav-mount"></div>

  <div class="form-card">
    <h2>Log in</h2>
    <p>New here? <a href="/register.html" style="color:var(--amber-dim); font-weight:600;">Create an account</a></p>
    <div id="alert-mount"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
    </form>
    <p class="helper" style="margin-top:16px;">Demo accounts &mdash; Owner: owner@demo.com / password123 &middot; Renter: renter@demo.com / password123</p>
  </div>

  <script src="/js/api.js"></script>
  <script>
    renderNav();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert('alert-mount');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await api('/auth/login', { method: 'POST', body: { email, password } });
        saveSession(res);
        window.location.href = '/index.html';
      } catch (err) {
        showAlert('alert-mount', err.message);
      }
    });
  </script>
</body>
</html>
